<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>flash</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  ruffle-player { width: 100%; height: 100%; display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
</head>
<body>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.__gameVolume = ${JSON.stringify(initialVolume)};

  window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    document.body.appendChild(player);
    const config = {
      scale: "showAll",
      salign: "",
      letterbox: "on",
      forceScale: true,
      forceAlign: true
    };
    player.load({
      url: 'GSSH.swf',
      ...config
    });

    player.volume = window.__gameVolume;
    window.__setVolume = function (v) {
      window.__gameVolume = v;
      player.volume = v;
    };
  });
</script>
</body>
</html>
